<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login — Secure Study Library</title>
<style>
:root{--navy:#102a56;--blue:#245ce5;--bg:#f4f7ff;--ink:#18243a;--muted:#65728a;--line:#dce4f2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 12px 35px #102a5612}h1{color:var(--navy);margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;margin-top:18px;cursor:pointer}.muted{color:var(--muted);font-size:14px}.status{margin-top:14px;padding:10px;border-radius:8px;background:#eef3ff;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;justify-content:space-between;margin-top:16px;font-size:14px}a{color:var(--blue)}
</style></head><body><main class="card"><h1>Student Login</h1><p class="muted">Sign in with the individual account provided by the website administrator to access authorised study PDFs.</p>
<form id="login"><label for="email">Username / Email</label><input id="email" type="email" autocomplete="username" required placeholder="your registered email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn">Sign in securely</button></form>
<div id="status" class="status" role="status">Your login is checked by Firebase Authentication.</div><div class="links"><a href="index.html">Home</a><a href="student-materials.html">Secure library</a></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="firebase-config.js"></script>
<script>
const s=document.getElementById('status');function msg(t){s.textContent=t}
if(!window.FIREBASE_CONFIG){msg('Firebase configuration was not found.');}
else{firebase.initializeApp(window.FIREBASE_CONFIG);const auth=firebase.auth();auth.onAuthStateChanged(u=>{if(u)location.replace('student-materials.html')});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg('Signing in…');try{await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);location.href='student-materials.html'}catch(err){msg('Sign-in failed. Check your username/email and password, then try again. ('+err.code+')')}})}
</script></body></html>
