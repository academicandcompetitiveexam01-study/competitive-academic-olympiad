<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Study Material Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #viewer-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loading {
            color: white;
            font-size: 18px;
            position: absolute;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="viewer-container">
        <div id="loading">Loading secure document...</div>
        <iframe id="pdf-frame" style="display:none;"></iframe>
    </div>

    <!-- Firebase App (The core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Storage & Auth -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Your Firebase Config File -->
    <script src="firebase-config.js"></script>

    <script>
        // Get the file path from URL parameters (e.g., secure-pdf.html?file=materials/math-olympiad.pdf)
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file');

        async function loadSecurePDF() {
            if (!filePath) {
                document.getElementById('loading').innerText = "Error: No document specified.";
                return;
            }

            try {
                // Ensure user is authenticated before fetching
                firebase.auth().onAuthStateChanged(async (user) => {
                    if (!user) {
                        document.getElementById('loading').innerText = "Access Denied: Please log in as a student.";
                        setTimeout(() => window.location.href = "student-login.html", 2000);
                        return;
                    }

                    // Reference Firebase Storage
                    const storageRef = firebase.storage().ref();
                    const fileRef = storageRef.child(filePath);

                    // Get a temporary download URL internally
                    const downloadUrl = await fileRef.getDownloadURL();

                    // Fetch the file binary data to create a secure Blob object
                    const response = await fetch(downloadUrl);
                    if (!response.ok) throw new Error("Failed to fetch file stream.");
                    
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);

                    // Display the PDF inside the iframe using the local blob URL
                    const iframe = document.getElementById('pdf-frame');
                    iframe.src = blobUrl + "#toolbar=0&navpanes=0";
                    iframe.style.display = "block";
                    document.getElementById('loading').style.display = "none";
                });

            } catch (error) {
                console.error("Error loading PDF:", error);
                document.getElementById('loading').innerText = "Error loading document or permission denied.";
            }
        }

        // Block Save / Print shortcuts
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'S' || e.key === 'P')) {
                e.preventDefault();
                alert("Downloading or printing this document is restricted.");
            }
        });

        loadSecurePDF();
    </script>
</body>
</html>
