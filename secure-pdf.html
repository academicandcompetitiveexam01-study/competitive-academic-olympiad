<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure PDF Viewer</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ff;color:#18243a}.top{background:#102a56;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#fff}.btn{background:#245ce5;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.notice{background:#fff;border:1px solid #dce4f2;border-radius:10px;padding:12px;margin-bottom:12px}.frame{width:100%;height:78vh;border:1px solid #dce4f2;background:#fff;border-radius:8px}.status{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><header class="top"><strong id="title">Secure PDF</strong><nav><a href="student-materials.html">Back to library</a>　<button class="btn" id="download" disabled>Download PDF</button>　<button class="btn" id="logout">Sign out</button></nav></header><main class="wrap"><div class="notice">This PDF is retrieved only after authentication. The download button is available to signed-in users. Do not share downloaded copies.</div><div id="status" class="notice status">Checking access…</div><iframe id="pdf" class="frame" title="Secure PDF preview"></iframe></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id);let auth,db,storage,blobUrl=null;
function msg(t){$('status').textContent=t}
function cleanName(s){return (s||'study-material.pdf').replace(/[\\/:*?"<>|]/g,'_')}
if(!window.FIREBASE_CONFIG){msg('Firebase configuration is missing.')}else{firebase.initializeApp(window.FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();storage=firebase.storage();auth.onAuthStateChanged(async user=>{if(!user){location.replace('student-login.html');return}const id=new URLSearchParams(location.search).get('id');if(!id||!/^[A-Za-z0-9_-]+$/.test(id)){msg('Invalid PDF reference.');return}try{const snap=await db.ref('secureMaterials/'+id).once('value');const item=snap.val();if(!item||item.published!==true||!item.storagePath){msg('This material is not published or you do not have access.');return}$('title').textContent=item.title||'Secure PDF';msg('Verifying permission and loading PDF…');const ref=storage.ref(item.storagePath);const blob=await ref.getBlob();if(blob.type!=='application/pdf'&& !String(item.storagePath).toLowerCase().endsWith('.pdf')){msg('The stored file does not appear to be a PDF.');return}blobUrl=URL.createObjectURL(blob);$('pdf').src=blobUrl;$('download').disabled=false;$('download').onclick=()=>{const a=document.createElement('a');a.href=blobUrl;a.download=cleanName(item.fileName||item.title)+ (String(item.fileName||item.title||'').toLowerCase().endsWith('.pdf')?'':'.pdf');document.body.appendChild(a);a.click();a.remove()};msg('PDF loaded for '+user.email+'. Access is checked by Firebase Storage rules.')}catch(e){msg('Access failed. Confirm you are signed in and that the administrator has configured secureMaterials and Firebase Storage rules. ('+e.code+')')}})}
$('logout').onclick=async()=>{await auth.signOut();location.href='student-login.html'};window.addEventListener('beforeunload',()=>{if(blobUrl)URL.revokeObjectURL(blobUrl)});
</script></body></html>
