<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Materials Library</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ff;color:#18243a;line-height:1.5}.top{background:#102a56;color:#fff;padding:18px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.top a{color:#ffbd59}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.panel,.item{background:#fff;border:1px solid #dce4f2;border-radius:14px;padding:18px;margin:12px 0}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.muted{color:#65728a;font-size:14px}.item h2{margin:0 0 6px;color:#102a56;font-size:20px}.tag{display:inline-block;background:#edf2ff;border-radius:20px;padding:3px 8px;margin:0 5px 8px 0;font-size:12px}.btn{display:inline-block;background:#245ce5;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700}.status{padding:12px;background:#eef3ff;border-radius:8px;white-space:pre-wrap}@media(max-width:650px){.filters{grid-template-columns:1fr}.top{padding:15px}}
</style></head><body><div class="top"><strong>Study Materials Library</strong><a href="index.html">← Home</a></div><main class="wrap"><section class="panel"><h1>Browse Study Materials</h1><p class="muted">Filter by class, subject or chapter. Only published materials appear here.</p><div class="filters"><select id="classFilter"><option value="">All classes / exams</option></select><input id="subjectFilter" placeholder="Filter by subject"><input id="searchFilter" placeholder="Search title or chapter"></div></section><div id="status" class="status">Loading published materials…</div><div id="results"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script>
(async function(){const status=document.getElementById("status"),results=document.getElementById("results"),cf=document.getElementById("classFilter"),sf=document.getElementById("subjectFilter"),qf=document.getElementById("searchFilter");if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey||window.FIREBASE_CONFIG.apiKey.includes("PASTE_")||!window.FIREBASE_CONFIG.appId||window.FIREBASE_CONFIG.appId.includes("PASTE_")){status.textContent="Website setup is not complete yet. Please check back later.";return;}try{firebase.initializeApp(window.FIREBASE_CONFIG);const snap=await firebase.database().ref("publishedMaterials").once("value");const all=Object.entries(snap.val()||{}).map(([id,r])=>({id,...r}));const classes=[...new Set(all.map(x=>x.className).filter(Boolean))].sort();classes.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;cf.appendChild(o)});function render(){const classV=cf.value,sub=sf.value.trim().toLowerCase(),q=qf.value.trim().toLowerCase();const filtered=all.filter(r=>(!classV||r.className===classV)&&(!sub||(r.subject||"").toLowerCase().includes(sub))&&(!q||[r.title,r.chapter,r.description].join(" ").toLowerCase().includes(q)));results.innerHTML="";if(!filtered.length){status.textContent="No published materials match your filters.";return;}status.textContent=filtered.length+" published material(s)";filtered.sort((a,b)=>(a.className||"").localeCompare(b.className||"")||(a.subject||"").localeCompare(b.subject||"")).forEach(r=>{const card=document.createElement("article");card.className="item";const h=document.createElement("h2");h.textContent=r.title||"Study material";card.appendChild(h);const tags=document.createElement("div");[r.className,r.subject,r.chapter].filter(Boolean).forEach(t=>{const s=document.createElement("span");s.className="tag";s.textContent=t;tags.appendChild(s)});card.appendChild(tags);if(r.description){const p=document.createElement("p");p.textContent=r.description;card.appendChild(p)}const a=document.createElement("a");a.className="btn";a.href=r.pdfUrl;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open PDF";card.appendChild(a);results.appendChild(card)})} [cf,sf,qf].forEach(x=>x.addEventListener("input",render));render();}catch(e){status.textContent="Unable to load published materials. Database access may not be configured yet.";}})();
</script></body></html>
